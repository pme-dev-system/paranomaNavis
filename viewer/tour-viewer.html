<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>PanoramaNavis ツアービューア</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #14171c;
    color: #e8eaed;
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  }
  #app { display: flex; height: 100%; }
  #side {
    width: 340px; min-width: 340px;
    display: flex; flex-direction: column;
    background: #1a1e25; border-right: 1px solid #2c313a;
    overflow-y: auto;
  }
  #side h1 { font-size: 15px; font-weight: 600; margin: 14px 16px 2px; }
  #tourInfo { font-size: 11px; color: #9aa0a6; margin: 0 16px 10px; line-height: 1.7; }
  #planWrap { position: relative; margin: 0 12px; }
  #plan { display: block; width: 100%; border-radius: 6px; cursor: pointer; }
  #pointList { margin: 10px 12px 14px; }
  .pointButton {
    display: flex; align-items: center; gap: 10px;
    width: 100%; box-sizing: border-box;
    padding: 7px 10px; margin-bottom: 4px;
    font-size: 13px; text-align: left;
    border: 1px solid #2c313a; border-radius: 6px;
    background: #232833; color: #e8eaed; cursor: pointer;
  }
  .pointButton:hover { background: #2c3340; }
  .pointButton.active { border-color: #ff8c00; background: #33301f; }
  .pointButton .badge {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: #2e68d2; color: #fff;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .pointButton.active .badge { background: #ff8c00; }
  #main { flex: 1; position: relative; min-width: 0; }
  #canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #canvas.dragging { cursor: grabbing; }
  #hud {
    position: absolute; left: 12px; bottom: 12px;
    font-size: 12px; color: #cdd1d6;
    background: rgba(20, 23, 28, 0.65); border-radius: 6px; padding: 6px 12px;
    pointer-events: none; max-width: calc(100% - 48px);
  }
  #hud.hidden { display: none; }
  #overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; padding: 24px;
    background: rgba(20, 23, 28, 0.94);
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 20px; font-weight: 600; margin: 0; }
  #overlay p { margin: 0; color: #9aa0a6; font-size: 14px; line-height: 1.9; }
  #overlay .error { color: #ff8a80; }
  #overlay.dragover { outline: 3px dashed #7aa2f7; outline-offset: -12px; }
  #folderButton {
    font-size: 14px; padding: 10px 24px; border-radius: 6px; border: 1px solid #3c4048;
    background: #232833; color: #e8eaed; cursor: pointer;
  }
  #folderButton:hover { background: #2c3340; }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1 id="tourTitle">PanoramaNavis ツアー</h1>
    <div id="tourInfo"></div>
    <div id="planWrap"><canvas id="plan"></canvas></div>
    <div id="pointList"></div>
  </aside>
  <main id="main">
    <canvas id="canvas"></canvas>
    <div id="hud" class="hidden"></div>
  </main>
</div>

<div id="overlay">
  <h1>PanoramaNavis ツアービューア</h1>
  <p>
    アドインが出力したツアーフォルダ（tour.json / plan / P01… を含むフォルダごと）を<br>
    ここへドラッグ＆ドロップしてください。<br>
    読み込み後は平面図の地点マーカーか一覧をクリックするとパノラマが表示されます。
  </p>
  <button id="folderButton" type="button">フォルダを選択...</button>
  <input id="folderInput" type="file" webkitdirectory hidden>
  <p id="loadError" class="error"></p>
</div>

<script>
"use strict";

var canvas = document.getElementById("canvas");
var overlay = document.getElementById("overlay");
var hud = document.getElementById("hud");
var planCanvas = document.getElementById("plan");
var pointListEl = document.getElementById("pointList");
var tourTitleEl = document.getElementById("tourTitle");
var tourInfoEl = document.getElementById("tourInfo");
var loadErrorEl = document.getElementById("loadError");
var folderInput = document.getElementById("folderInput");

var gl = canvas.getContext("webgl", { antialias: true });
if (!gl) {
  overlay.innerHTML = "<h1>WebGLが利用できません</h1><p>別のブラウザでお試しください。</p>";
  throw new Error("WebGL unavailable");
}

// ---- パノラマ描画（panorama-viewer.html と同一の座標規約） ----
// right=+X, forward=+Y, up=+Z / 画像中央が lon=0 (forward=北) / 上端が lat=+90°

var VERT = [
  "attribute vec2 a_pos;",
  "varying vec2 v_ndc;",
  "void main() {",
  "  v_ndc = a_pos;",
  "  gl_Position = vec4(a_pos, 0.0, 1.0);",
  "}"
].join("\n");

var FRAG = [
  "precision highp float;",
  "varying vec2 v_ndc;",
  "uniform sampler2D u_tex;",
  "uniform vec3 u_forward;",
  "uniform vec3 u_right;",
  "uniform vec3 u_up;",
  "uniform float u_tanHalfFov;",
  "uniform float u_aspect;",
  "const float PI = 3.141592653589793;",
  "void main() {",
  "  vec3 d = normalize(u_forward",
  "    + v_ndc.x * u_tanHalfFov * u_aspect * u_right",
  "    + v_ndc.y * u_tanHalfFov * u_up);",
  "  float lon = atan(d.x, d.y);",
  "  float lat = asin(clamp(d.z, -1.0, 1.0));",
  "  vec2 uv = vec2(fract((lon + PI) / (2.0 * PI)), 0.5 - lat / PI);",
  "  gl_FragColor = texture2D(u_tex, uv);",
  "}"
].join("\n");

function compile(type, source) {
  var shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

var program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS))
  throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);

var quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER,
  new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
var aPos = gl.getAttribLocation(program, "a_pos");
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

var uni = {
  forward: gl.getUniformLocation(program, "u_forward"),
  right: gl.getUniformLocation(program, "u_right"),
  up: gl.getUniformLocation(program, "u_up"),
  tanHalfFov: gl.getUniformLocation(program, "u_tanHalfFov"),
  aspect: gl.getUniformLocation(program, "u_aspect")
};

var texture = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, texture);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

var state = {
  loaded: false,
  yaw: 0,             // ラジアン。0 = forward(+Y=北)、正で東回り
  pitch: 0,
  fovDeg: 75
};

// ---- ツアー状態 ----

var tour = null;        // tour.json の内容
var fileMap = null;     // 相対パス(小文字) → File。HTTP配信時は null（fetchで解決）
var baseDir = "";       // tour.json のあるディレクトリ（"" または "xxx/" 形式）
var planImage = null;
var currentIndex = -1;
var planDirty = true;
var lastDrawnYaw = null;
var lastDrawnFov = null;

function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = Math.round(canvas.clientWidth * dpr);
  var h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}

function render() {
  resize();
  gl.clearColor(0.08, 0.09, 0.11, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  if (state.loaded) {
    var cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    var cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
    var forward = [cp * sy, cp * cy, sp];
    var right = [cy, -sy, 0];
    var up = [-sp * sy, -sp * cy, cp];
    var tanHalfFov = Math.tan(state.fovDeg * Math.PI / 360);
    gl.uniform3fv(uni.forward, forward);
    gl.uniform3fv(uni.right, right);
    gl.uniform3fv(uni.up, up);
    gl.uniform1f(uni.tanHalfFov, tanHalfFov);
    gl.uniform1f(uni.aspect, canvas.width / canvas.height);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  // 視線方向の扇形を平面図へ反映（見回しに追従）
  if (tour && (planDirty ||
      lastDrawnYaw === null || Math.abs(state.yaw - lastDrawnYaw) > 0.01 ||
      Math.abs(state.fovDeg - (lastDrawnFov || 0)) > 0.5)) {
    drawPlan();
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

// ---- ファイル解決 ----

function normalizePath(path) {
  return path.replace(/\\/g, "/").replace(/^\/+/, "").toLowerCase();
}

function getBlob(relPath) {
  if (fileMap) {
    var file = fileMap.get(normalizePath(baseDir + relPath));
    if (!file)
      return Promise.reject(new Error("フォルダ内にファイルが見つかりません: " + baseDir + relPath));
    return Promise.resolve(file);
  }
  return fetch(baseDir + relPath).then(function (res) {
    if (!res.ok) throw new Error("読み込みに失敗しました: " + relPath);
    return res.blob();
  });
}

function loadImageFromBlob(blob) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("画像を読み込めませんでした")); };
    img.src = url;
  });
}

// ---- ツアー読み込み ----

function showLoadError(message) {
  loadErrorEl.textContent = message;
  overlay.classList.remove("hidden");
}

function loadTourFromJsonBlob(blob) {
  return blob.text().then(function (text) {
    tour = JSON.parse(text);
    if (!tour.plan || !tour.points)
      throw new Error("tour.json の形式が不正です（plan / points がありません）");
    return getBlob(tour.plan.image);
  }).then(loadImageFromBlob).then(function (img) {
    planImage = img;
    overlay.classList.add("hidden");
    loadErrorEl.textContent = "";
    tourTitleEl.textContent = tour.tour_id || "PanoramaNavis ツアー";
    tourInfoEl.textContent =
      "地点数: " + tour.points.length +
      " / 床レベルZ: " + formatNumber(tour.plan.floor_z) +
      " / 厚み: " + formatNumber(tour.plan.slab_thickness) +
      (tour.model_units ? "（" + tour.model_units + "）" : "") +
      (tour.created_at ? "\n作成: " + tour.created_at : "");
    buildPointList();
    planDirty = true;

    // #p=P02 のようなハッシュで初期地点を指定できる（既定は先頭）
    var initial = 0;
    var match = /[#&]p=([^&]+)/.exec(location.hash);
    if (match) {
      for (var i = 0; i < tour.points.length; i++)
        if (tour.points[i].id === decodeURIComponent(match[1])) { initial = i; break; }
    }
    if (tour.points.length > 0)
      selectPoint(initial);
  }).catch(function (err) {
    showLoadError(err.message || String(err));
  });
}

function formatNumber(value) {
  if (typeof value !== "number") return "—";
  return Math.round(value * 1000) / 1000;
}

// ドロップ/フォルダ選択されたファイル群からツアーを読み込む
function loadTourFromFiles(entries) {
  fileMap = new Map();
  var jsonCandidates = [];
  entries.forEach(function (entry) {
    var path = normalizePath(entry.path);
    fileMap.set(path, entry.file);
    if (path === "tour.json" || path.slice(-10) === "/tour.json")
      jsonCandidates.push(path);
  });
  if (jsonCandidates.length === 0) {
    showLoadError("tour.json が見つかりません。ツアーフォルダごとドロップしてください。");
    return;
  }
  // 最も浅い階層の tour.json を採用する
  jsonCandidates.sort(function (a, b) {
    return (a.split("/").length - b.split("/").length) || a.localeCompare(b);
  });
  baseDir = jsonCandidates[0].slice(0, jsonCandidates[0].length - "tour.json".length);
  loadTourFromJsonBlob(fileMap.get(jsonCandidates[0]));
}

// DataTransferItem からフォルダを再帰的に読む（readEntries は分割返却のため繰り返す）
function collectDroppedEntries(dataTransfer) {
  var results = [];
  var pending = [];

  function walkEntry(entry) {
    return new Promise(function (resolve) {
      if (entry.isFile) {
        entry.file(function (file) {
          results.push({ path: entry.fullPath, file: file });
          resolve();
        }, function () { resolve(); });
      } else if (entry.isDirectory) {
        var reader = entry.createReader();
        var readBatch = function () {
          reader.readEntries(function (batch) {
            if (batch.length === 0) { resolve(); return; }
            Promise.all(batch.map(walkEntry)).then(readBatch);
          }, function () { resolve(); });
        };
        readBatch();
      } else {
        resolve();
      }
    });
  }

  for (var i = 0; i < dataTransfer.items.length; i++) {
    var item = dataTransfer.items[i];
    var entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
    if (entry) {
      pending.push(walkEntry(entry));
    } else {
      var file = item.getAsFile && item.getAsFile();
      if (file) results.push({ path: file.name, file: file });
    }
  }
  return Promise.all(pending).then(function () { return results; });
}

// ---- 平面図＋マーカー描画 ----

function drawPlan() {
  if (!planImage) return;
  planDirty = false;
  lastDrawnYaw = state.yaw;
  lastDrawnFov = state.fovDeg;

  var cssWidth = planCanvas.clientWidth || planCanvas.parentElement.clientWidth;
  if (cssWidth <= 0) { planDirty = true; return; }
  var scale = cssWidth / planImage.width;
  var cssHeight = planImage.height * scale;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  planCanvas.style.height = cssHeight + "px";
  if (planCanvas.width !== Math.round(cssWidth * dpr) ||
      planCanvas.height !== Math.round(cssHeight * dpr)) {
    planCanvas.width = Math.round(cssWidth * dpr);
    planCanvas.height = Math.round(cssHeight * dpr);
  }

  var ctx = planCanvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssWidth, cssHeight);
  ctx.drawImage(planImage, 0, 0, cssWidth, cssHeight);

  for (var i = 0; i < tour.points.length; i++) {
    var p = tour.points[i];
    var x = p.pixel_x * scale;
    var y = p.pixel_y * scale;
    var active = i === currentIndex;

    // アクティブ地点は視線方向の扇形（yaw=0が北=画像上、東回り）を描く
    if (active) {
      var half = state.fovDeg * Math.PI / 360;
      var start = state.yaw - Math.PI / 2 - half; // canvasの角度は+X基準・時計回り
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.arc(x, y, 34, start, start + half * 2);
      ctx.closePath();
      ctx.fillStyle = "rgba(255, 140, 0, 0.30)";
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(x, y, 10, 0, Math.PI * 2);
    ctx.fillStyle = active ? "rgba(255,140,0,0.95)" : "rgba(46,104,210,0.92)";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#fff";
    ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.font = "bold 10px 'Segoe UI', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(i + 1), x, y + 0.5);
  }
}

planCanvas.addEventListener("click", function (e) {
  if (!tour || !planImage) return;
  var rect = planCanvas.getBoundingClientRect();
  var scale = rect.width / planImage.width;
  var best = -1, bestDist = 16;
  for (var i = 0; i < tour.points.length; i++) {
    var dx = tour.points[i].pixel_x * scale - (e.clientX - rect.left);
    var dy = tour.points[i].pixel_y * scale - (e.clientY - rect.top);
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < bestDist) { bestDist = dist; best = i; }
  }
  if (best >= 0)
    selectPoint(best);
});

window.addEventListener("resize", function () { planDirty = true; });

// ---- 地点一覧・選択 ----

function buildPointList() {
  pointListEl.innerHTML = "";
  tour.points.forEach(function (p, i) {
    var button = document.createElement("button");
    button.type = "button";
    button.className = "pointButton";
    var badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = String(i + 1);
    var label = document.createElement("span");
    label.textContent = (p.name && p.name !== p.id) ? p.id + "  " + p.name : p.id;
    button.appendChild(badge);
    button.appendChild(label);
    button.addEventListener("click", function () { selectPoint(i); });
    pointListEl.appendChild(button);
  });
}

function updateListHighlight() {
  var buttons = pointListEl.children;
  for (var i = 0; i < buttons.length; i++)
    buttons[i].classList.toggle("active", i === currentIndex);
}

function selectPoint(index) {
  if (!tour || index < 0 || index >= tour.points.length) return;
  var point = tour.points[index];
  currentIndex = index;
  updateListHighlight();
  planDirty = true;
  hud.textContent = "読み込み中... " + point.id;
  hud.classList.remove("hidden");

  var requested = index;
  getBlob(point.panorama).then(loadImageFromBlob).then(function (img) {
    if (currentIndex !== requested) return; // 読込中に別地点へ切り替えた場合は破棄
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    state.loaded = true;
    state.yaw = 0;   // 北向きで開始（平面図の上と一致）
    state.pitch = 0;
    var name = (point.name && point.name !== point.id) ? point.id + " " + point.name : point.id;
    hud.textContent = name + "  — ドラッグ: 見回し / ホイール: ズーム / ←→: 地点切替";
    try {
      history.replaceState(null, "", "#p=" + encodeURIComponent(point.id));
    } catch (e) { /* file:// では失敗することがある */ }
  }).catch(function (err) {
    hud.textContent = "読み込み失敗: " + (err.message || err);
  });
}

document.addEventListener("keydown", function (e) {
  if (!tour || tour.points.length === 0) return;
  if (e.key === "ArrowRight")
    selectPoint((currentIndex + 1) % tour.points.length);
  else if (e.key === "ArrowLeft")
    selectPoint((currentIndex - 1 + tour.points.length) % tour.points.length);
});

// URLのハッシュ（#p=P02）で地点を切り替えられるようにする
// （selectPoint 内の replaceState は hashchange を発火させないためループしない）
window.addEventListener("hashchange", function () {
  if (!tour) return;
  var match = /[#&]p=([^&]+)/.exec(location.hash);
  if (!match) return;
  var id = decodeURIComponent(match[1]);
  for (var i = 0; i < tour.points.length; i++) {
    if (tour.points[i].id === id && i !== currentIndex) {
      selectPoint(i);
      return;
    }
  }
});

// ---- 読み込みUI（ドラッグ＆ドロップ / フォルダ選択 / HTTP自動読込） ----

document.getElementById("folderButton").addEventListener("click", function () {
  folderInput.click();
});
folderInput.addEventListener("change", function () {
  var entries = [];
  for (var i = 0; i < folderInput.files.length; i++) {
    var file = folderInput.files[i];
    entries.push({ path: file.webkitRelativePath || file.name, file: file });
  }
  if (entries.length > 0)
    loadTourFromFiles(entries);
});

["dragover", "dragenter"].forEach(function (type) {
  window.addEventListener(type, function (e) {
    e.preventDefault();
    overlay.classList.add("dragover");
  });
});
["dragleave", "drop"].forEach(function (type) {
  window.addEventListener(type, function (e) {
    e.preventDefault();
    overlay.classList.remove("dragover");
  });
});
window.addEventListener("drop", function (e) {
  e.preventDefault();
  overlay.classList.remove("hidden"); // 読み込み失敗時に案内が見えるように
  collectDroppedEntries(e.dataTransfer).then(function (entries) {
    if (entries.length > 0)
      loadTourFromFiles(entries);
  });
});

// HTTP配信時は同フォルダの tour.json を自動読込（file:// では静かに失敗する）
if (location.protocol === "http:" || location.protocol === "https:") {
  fetch("tour.json").then(function (res) {
    if (res.ok) return res.blob();
    throw new Error("not found");
  }).then(function (blob) {
    fileMap = null;
    baseDir = "";
    return loadTourFromJsonBlob(blob);
  }).catch(function () { /* 自動読込は任意機能 */ });
}

// ---- パノラマ操作（ポインタ1本: 見回し / 2本: ピンチズーム / ホイール: ズーム） ----
var pointers = new Map();
var pinchStartDist = 0;
var pinchStartFov = 0;

canvas.addEventListener("pointerdown", function (e) {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    var pts = Array.from(pointers.values());
    pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    pinchStartFov = state.fovDeg;
  }
  canvas.classList.add("dragging");
});

canvas.addEventListener("pointermove", function (e) {
  var prev = pointers.get(e.pointerId);
  if (!prev) return;
  var dx = e.clientX - prev.x;
  var dy = e.clientY - prev.y;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1 && state.loaded) {
    var k = (state.fovDeg * Math.PI / 180) / canvas.clientHeight;
    state.yaw -= dx * k;
    state.pitch += dy * k;
    var limit = Math.PI / 2 - 0.01;
    state.pitch = Math.max(-limit, Math.min(limit, state.pitch));
  } else if (pointers.size === 2 && pinchStartDist > 0) {
    var pts = Array.from(pointers.values());
    var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (dist > 0)
      setFov(pinchStartFov * pinchStartDist / dist);
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2)
    pinchStartDist = 0;
  if (pointers.size === 0)
    canvas.classList.remove("dragging");
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);

function setFov(deg) {
  state.fovDeg = Math.max(25, Math.min(110, deg));
}

canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  setFov(state.fovDeg * Math.exp(e.deltaY * 0.0012));
}, { passive: false });
</script>
</body>
</html>
