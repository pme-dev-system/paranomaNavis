<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>PanoramaNavis ビューア</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #14171c;
    color: #e8eaed;
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  }
  #canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #canvas.dragging { cursor: grabbing; }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; padding: 24px;
    background: rgba(20, 23, 28, 0.92);
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 20px; font-weight: 600; margin: 0; }
  #overlay p { margin: 0; color: #9aa0a6; font-size: 14px; line-height: 1.8; }
  #overlay.dragover { outline: 3px dashed #7aa2f7; outline-offset: -12px; }
  #fileButton {
    font-size: 14px; padding: 10px 24px; border-radius: 6px; border: 1px solid #3c4048;
    background: #232833; color: #e8eaed; cursor: pointer;
  }
  #fileButton:hover { background: #2c3340; }
  #hud {
    position: absolute; left: 12px; bottom: 12px;
    font-size: 12px; color: #cdd1d6;
    background: rgba(20, 23, 28, 0.65); border-radius: 6px; padding: 6px 12px;
    pointer-events: none;
  }
  #hud.hidden { display: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="overlay">
  <h1>PanoramaNavis 360°ビューア</h1>
  <p>
    正距円筒図法（幅:高さ＝2:1）のパノラマ画像をここへドラッグ＆ドロップしてください。<br>
    読み込み後はドラッグで見回し、ホイール／ピンチでズームできます。
  </p>
  <button id="fileButton" type="button">画像ファイルを選択...</button>
  <input id="fileInput" type="file" accept="image/*" hidden>
</div>

<div id="hud" class="hidden"></div>

<script>
"use strict";

var canvas = document.getElementById("canvas");
var overlay = document.getElementById("overlay");
var hud = document.getElementById("hud");
var fileInput = document.getElementById("fileInput");

var gl = canvas.getContext("webgl", { antialias: true });
if (!gl) {
  overlay.innerHTML = "<h1>WebGLが利用できません</h1><p>別のブラウザでお試しください。</p>";
  throw new Error("WebGL unavailable");
}

var VERT = [
  "attribute vec2 a_pos;",
  "varying vec2 v_ndc;",
  "void main() {",
  "  v_ndc = a_pos;",
  "  gl_Position = vec4(a_pos, 0.0, 1.0);",
  "}"
].join("\n");

// 座標規約は生成側 (PanoramaNavis.Core) と一致させること:
// right=+X, forward=+Y, up=+Z / 画像中央が lon=0 (forward) / 上端が lat=+90°
var FRAG = [
  "precision highp float;",
  "varying vec2 v_ndc;",
  "uniform sampler2D u_tex;",
  "uniform vec3 u_forward;",
  "uniform vec3 u_right;",
  "uniform vec3 u_up;",
  "uniform float u_tanHalfFov;",
  "uniform float u_aspect;",
  "const float PI = 3.141592653589793;",
  "void main() {",
  "  vec3 d = normalize(u_forward",
  "    + v_ndc.x * u_tanHalfFov * u_aspect * u_right",
  "    + v_ndc.y * u_tanHalfFov * u_up);",
  "  float lon = atan(d.x, d.y);",
  "  float lat = asin(clamp(d.z, -1.0, 1.0));",
  "  vec2 uv = vec2(fract((lon + PI) / (2.0 * PI)), 0.5 - lat / PI);",
  "  gl_FragColor = texture2D(u_tex, uv);",
  "}"
].join("\n");

function compile(type, source) {
  var shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

var program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS))
  throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);

var quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER,
  new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
var aPos = gl.getAttribLocation(program, "a_pos");
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

var uni = {
  forward: gl.getUniformLocation(program, "u_forward"),
  right: gl.getUniformLocation(program, "u_right"),
  up: gl.getUniformLocation(program, "u_up"),
  tanHalfFov: gl.getUniformLocation(program, "u_tanHalfFov"),
  aspect: gl.getUniformLocation(program, "u_aspect")
};

var texture = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, texture);
// 非2のべき乗サイズでも動くよう CLAMP_TO_EDGE + LINEAR（経度の折返しはシェーダ側の fract で処理）
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

var state = {
  loaded: false,
  yaw: 0,             // ラジアン。0 = forward(+Y)、正で東回り
  pitch: 0,           // ラジアン。正で上向き
  fovDeg: 75,
  fileName: ""
};

function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = Math.round(canvas.clientWidth * dpr);
  var h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}

function render() {
  resize();
  gl.clearColor(0.08, 0.09, 0.11, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  if (state.loaded) {
    var cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    var cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
    var forward = [cp * sy, cp * cy, sp];
    var right = [cy, -sy, 0];
    var up = [-sp * sy, -sp * cy, cp];
    var tanHalfFov = Math.tan(state.fovDeg * Math.PI / 360);
    gl.uniform3fv(uni.forward, forward);
    gl.uniform3fv(uni.right, right);
    gl.uniform3fv(uni.up, up);
    gl.uniform1f(uni.tanHalfFov, tanHalfFov);
    gl.uniform1f(uni.aspect, canvas.width / canvas.height);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

function loadImageSource(src, name) {
  var img = new Image();
  img.onload = function () {
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    state.loaded = true;
    state.yaw = 0;
    state.pitch = 0;
    overlay.classList.add("hidden");
    var ratioNote = Math.abs(img.width / img.height - 2) > 0.01
      ? "（注意: 2:1比率ではありません）" : "";
    hud.textContent = name + "  " + img.width + "×" + img.height + ratioNote +
      "  — ドラッグ: 見回し / ホイール: ズーム";
    hud.classList.remove("hidden");
    if (src.indexOf("blob:") === 0)
      URL.revokeObjectURL(src);
  };
  img.onerror = function () {
    alert("画像を読み込めませんでした: " + name);
  };
  img.src = src;
}

function loadFile(file) {
  if (!file || file.type.indexOf("image/") !== 0) {
    alert("画像ファイルを指定してください。");
    return;
  }
  loadImageSource(URL.createObjectURL(file), file.name);
}

document.getElementById("fileButton").addEventListener("click", function () {
  fileInput.click();
});
fileInput.addEventListener("change", function () {
  if (fileInput.files.length > 0)
    loadFile(fileInput.files[0]);
});

["dragover", "dragenter"].forEach(function (type) {
  window.addEventListener(type, function (e) {
    e.preventDefault();
    overlay.classList.add("dragover");
  });
});
["dragleave", "drop"].forEach(function (type) {
  window.addEventListener(type, function (e) {
    e.preventDefault();
    overlay.classList.remove("dragover");
  });
});
window.addEventListener("drop", function (e) {
  if (e.dataTransfer.files.length > 0)
    loadFile(e.dataTransfer.files[0]);
});

// HTTP配信時は同フォルダの panorama.jpg を自動読込（file:// では静かに失敗する）
if (location.protocol === "http:" || location.protocol === "https:") {
  fetch("panorama.jpg").then(function (res) {
    if (res.ok) return res.blob();
    throw new Error("not found");
  }).then(function (blob) {
    loadImageSource(URL.createObjectURL(blob), "panorama.jpg");
  }).catch(function () { /* 自動読込は任意機能 */ });
}

// ---- 操作（ポインタ1本: 見回し / 2本: ピンチズーム / ホイール: ズーム） ----
var pointers = new Map();
var pinchStartDist = 0;
var pinchStartFov = 0;

canvas.addEventListener("pointerdown", function (e) {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    var pts = Array.from(pointers.values());
    pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    pinchStartFov = state.fovDeg;
  }
  canvas.classList.add("dragging");
});

canvas.addEventListener("pointermove", function (e) {
  var prev = pointers.get(e.pointerId);
  if (!prev) return;
  var dx = e.clientX - prev.x;
  var dy = e.clientY - prev.y;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1 && state.loaded) {
    // 「掴んで動かす」操作感: 画面高さぶんのドラッグ = 縦画角ぶんの回転
    var k = (state.fovDeg * Math.PI / 180) / canvas.clientHeight;
    state.yaw -= dx * k;
    state.pitch += dy * k;
    var limit = Math.PI / 2 - 0.01;
    state.pitch = Math.max(-limit, Math.min(limit, state.pitch));
  } else if (pointers.size === 2 && pinchStartDist > 0) {
    var pts = Array.from(pointers.values());
    var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (dist > 0)
      setFov(pinchStartFov * pinchStartDist / dist);
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2)
    pinchStartDist = 0;
  if (pointers.size === 0)
    canvas.classList.remove("dragging");
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);

function setFov(deg) {
  state.fovDeg = Math.max(25, Math.min(110, deg));
}

canvas.addEventListener("wheel", function (e) {
  e.preventDefault();
  setFov(state.fovDeg * Math.exp(e.deltaY * 0.0012));
}, { passive: false });
</script>
</body>
</html>
